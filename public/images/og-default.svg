      <stop offset="0%" stop-color="#3f57ea"/>
      <stop offset="50%" stop-color="#3344d7"/>
      <stop offset="100%" stop-color="#293489"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative dice -->
